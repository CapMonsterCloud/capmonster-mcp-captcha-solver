name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

  publish-testpypi:
    needs: test
    # Every push to dev must land as a tagged release commit (see below);
    # untagged pushes to dev fail this job instead of silently skipping it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an exact version tag on HEAD
        run: |
          if ! git describe --tags --exact-match --match "v*" HEAD; then
            echo "::error::dev was pushed without an exact vX.Y.Z tag on HEAD. Tag the release commit before pushing to dev, e.g.:"
            echo "::error::  git tag v0.1.2 && git push origin dev v0.1.2"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    needs: test
    # Every push to main must land as a tagged release commit (see below);
    # untagged pushes to main fail this job instead of silently skipping it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an exact version tag on HEAD
        run: |
          if ! git describe --tags --exact-match --match "v*" HEAD; then
            echo "::error::main was pushed without an exact vX.Y.Z tag on HEAD. Tag the release commit before pushing to main, e.g.:"
            echo "::error::  git tag v0.1.2 && git push origin main v0.1.2"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
